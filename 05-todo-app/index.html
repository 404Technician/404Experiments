<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../site.css">
</head>
<body>
    <nav class="site-nav" aria-label="Site navigation">
        <a class="site-brand" href="../index.html" aria-label="404Experiments home"><span class="brand-mark">404</span></a>
        <div class="site-nav-links">
            <a href="../index.html">Home</a>
            <a class="nav-index" href="../experiments/index.html">Experiments</a>
            <a href="../apis/index.html">APIs</a>
        </div>
    </nav>

    <main>
        <h1>To-do App</h1>

        <div class="todo-input">
            <input id="taskInput" type="text" placeholder="Add a task">
            <label class="due-date-input" for="dueDateInput">
                Due date
                <input id="dueDateInput" type="date">
            </label>
            <button id="addButton">Add</button>
        </div>

        <div class="task-controls">
            <div class="filters">
                <button data-filter="all">All</button>
                <button data-filter="active">Active</button>
                <button data-filter="completed">Completed</button>
            </div>
            <label class="sort-control" for="sortOrder">
                Sort by
                <select id="sortOrder">
                    <option value="created">Created order</option>
                    <option value="due-asc">Due date ascending</option>
                    <option value="due-desc">Due date descending</option>
                </select>
            </label>
        </div>

        <ul id="taskList"></ul>

        <p id="message"></p>
        
    </main>

    <script src="script.js"></script>
</body>
</html>

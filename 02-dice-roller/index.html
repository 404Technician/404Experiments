    <main>
    <h1>Dice Roller</h1>

    <button onclick="rollDice()">
        Roll the dice
    </button>

    <p id="result">Press the button.</p>
    </main>

    <script>
        function rollDice() {
            const result = Math.floor(Math.random() * 6) + 1;
            document.getElementById("result").textContent =
                "You rolled: " + result;
        }
    </script>

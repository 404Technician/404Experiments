<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="../site.css">
</head>
<body>
    <nav class="site-nav" aria-label="Site navigation">
        <a class="site-brand" href="../index.html" aria-label="404Experiments home"><span class="brand-mark">404</span></a>
        <div class="site-nav-links">
            <a href="../index.html" aria-label="NEXUS / Home" title="Home">NEXUS</a>
            <a class="nav-index" href="../experiments/index.html" aria-label="LAB / Experiments" title="Experiments">LAB</a>
            <a href="../apis/index.html" aria-label="SIGNALS / APIs" title="APIs">SIGNALS</a>
        </div>
    </nav>

    <main>
    <h1>Counter</h1>

    <h2 id="counter">0</h2>

    <button onclick="decrease()">-1</button>
    <button onclick="resetCounter()">Reset</button>
    <button onclick="increase()">+1</button>
    </main>

    <script>
        let count = 0;

        function updateCounter() {
            document.getElementById("counter").textContent = count;
        }

        function increase() {
            count++;
            updateCounter();
        }

        function decrease() {
            count--;
            updateCounter();
        }

        function resetCounter() {
            count = 0;
            updateCounter();
        }
    </script>

</body>
</html>

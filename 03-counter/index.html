    <main id="main-content" tabindex="-1">
    <h1>Counter</h1>

    <h2 id="counter">0</h2>

    <button onclick="decrease()">-1</button>
    <button onclick="resetCounter()">Reset</button>
    <button onclick="increase()">+1</button>
        <section class="connected-nodes" aria-labelledby="connected-nodes-heading">
            <h2 class="connected-heading" id="connected-nodes-heading">CONNECTED NODES</h2>
            <ul class="connected-list">
                <li><a href="../01-random-number/index.html"><span class="connected-title">01 / Random Number Generator</span><span class="connected-description">Choose an integer from a defined range.</span><span class="connected-arrow" aria-hidden="true">→</span></a></li>
                <li><a href="../05-todo-app/index.html"><span class="connected-title">05 / To-do App</span><span class="connected-description">Organize tasks, dates and filters.</span><span class="connected-arrow" aria-hidden="true">→</span></a></li>
            </ul>
        </section>
    </main>

    <script>
        let count = 0;

        function updateCounter() {
            document.getElementById("counter").textContent = count;
        }

        function increase() {
            count++;
            updateCounter();
        }

        function decrease() {
            count--;
            updateCounter();
        }

        function resetCounter() {
            count = 0;
            updateCounter();
        }
    </script>
